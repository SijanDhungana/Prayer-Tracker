# .github/workflows/geocode.yml
# Replaces the hand-typed masjid coordinates with real geocoded ones and
# commits the result. Run it by hand from the Actions tab — it isn't on a
# schedule because addresses rarely change. Uses OpenStreetMap's free
# Nominatim geocoder, so it needs no API key and no billing.

name: Geocode masjid addresses

on:
  workflow_dispatch: {} # Actions tab → this workflow → "Run workflow"

permissions:
  contents: write # to commit the corrected coordinates back

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Geocode addresses
        run: npx tsx scripts/geocode.ts

      - name: Commit corrected coordinates
        run: |
          git config user.name  "prayer-times-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/masjids.json
          git diff --staged --quiet || git commit -m "chore: geocode masjid coordinates ($(date -u +%F))"
          git push
