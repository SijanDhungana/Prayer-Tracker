# .github/workflows/daily-scrape.yml
# Refreshes src/data/masjids.json once a day and commits it. No server or
# laptop needed.
#
# The cron is hourly, but the scrape itself happens once — scripts/scrape-window.ts
# decides which hour. That indirection exists because a fixed UTC cron cannot
# stay ahead of Fajr: Toronto's Fajr runs from 07:45 UTC in late June to 11:23
# UTC in January, and daylight saving moves it again. This used to be a flat
# "0 9 * * *", which meant that all summer the refresh landed AFTER Fajr had
# passed — stale at the one moment of the day it most needed to be current.
#
# A skipped hour costs about fifteen seconds: the window is decided before
# Playwright's browser download, which is the expensive step.

name: Daily prayer-time scrape

on:
  schedule:
    # Hourly. scrape-window.ts lets exactly one of these through per day,
    # two hours before Toronto's Fajr — see that file for why two and not one.
    - cron: "0 * * * *"
  workflow_dispatch: {} # a hand-triggered run always scrapes, window or not

permissions:
  contents: write # needed to commit the updated JSON back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Before the browser download, so the 23 skipped runs stay cheap.
      - name: Is this the hour?
        id: window
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npx tsx scripts/scrape-window.ts

      # Install the headless browser Playwright drives.
      - if: steps.window.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # Fails loudly rather than burning a whole run to produce nothing.
      # The secret goes through env, never interpolated into the shell command.
      - name: Check for API key
        if: steps.window.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run scraper
        if: steps.window.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scrape.ts

      - name: Commit refreshed times
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name  "prayer-times-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/masjids.json
          git diff --staged --quiet || git commit -m "chore: refresh prayer times ($(date -u +%F))"
          # Another job may have landed on main while this run was scraping.
          git pull --rebase origin main
          git push
