# .github/workflows/ci.yml
# Runs the same build Vercel runs, on every push and pull request, so a
# broken build fails here — visibly, on the commit — instead of showing up
# as a red Vercel deployment after the fact.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      # check:iframe-text launches a real Chromium — the only one of these
      # suites that does — to prove capturePage actually reads a widget's
      # iframe rather than trusting the source. Every other check here is
      # pure logic and has run fine without a browser installed; this one
      # step exists only because that changed.
      - run: npx playwright install --with-deps chromium
      # The scraper's own logic — Jumu'ah merging, the Ad-Din mapping, the
      # invariant checks — has no other guard. It runs unattended against a
      # worship app's data, so its unit suites belong in front of a merge
      # rather than being remembered by hand.
      - run: npm run check
