<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) report real
      numbers. Without it iOS returns zero for all four, so every safe-area
      calculation in the app silently collapses — the map's floating search bar
      lands under the Dynamic Island and the tab bar sits on the home
      indicator. Harmless-looking in a desktop browser, wrong on every notched
      phone, which is now the main target.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Compare iqamah and Jummah times across Toronto masjids."
    />
    <title>Toronto Masjid Times</title>
    <!-- The two faces above the fold, so the first paint has them. -->
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/instrument-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/plexmono-500.woff2" crossorigin />
    <!--
      The Maps SDK itself must not load on boot (design spec v2 §8.1), but the
      DNS lookup and TLS handshake for it can be done ahead of time for free.
      The first open of the map paid for both on top of the download, which is
      what made it feel like it had failed.
    -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <script>
      // Apply a saved theme before first paint. Without this the page renders
      // in the system theme and then snaps to the chosen one, which is worse
      // than not offering the choice. Deliberately inline and tiny.
      try {
        var t = localStorage.getItem("prayer-tracker:theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
