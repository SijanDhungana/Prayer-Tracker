<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare iqamah and Jummah times across Toronto masjids."
    />
    <title>Toronto Masjid Times</title>
    <!-- The two faces above the fold, so the first paint has them. -->
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/instrument-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/plexmono-500.woff2" crossorigin />
    <script>
      // Apply a saved theme before first paint. Without this the page renders
      // in the system theme and then snaps to the chosen one, which is worse
      // than not offering the choice. Deliberately inline and tiny.
      try {
        var t = localStorage.getItem("prayer-tracker:theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
